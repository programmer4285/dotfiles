# https://github.com/omacom/omarchy/blob/quattro/config/tmux/tmux.conf

# Config and help
bind -N "Reload configuration" q source-file ~/.tmux.conf \; display "Configuration reloaded"

# General
set -g default-terminal "xterm-ghostty"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
# set -g extended-keys on
# set -g extended-keys-format csi-u
# set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k confirm-before -p "kill-window #W? (y/n)" kill-window
